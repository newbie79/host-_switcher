<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Host Switcher - 관리</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    max-width: 640px;
    margin: 40px auto;
    color: #1a1a1a;
    padding: 0 16px 60px 16px;
  }
  h1 { font-size: 18px; margin-bottom: 4px; }
  .sub { font-size: 12px; color: #888; margin-bottom: 20px; }

  .domain-card {
    border: 1px solid #e2e2e2;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
    background: #fafafa;
  }
  .domain-card .row-top {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    margin-bottom: 12px;
  }
  .domain-card .row-top .field { flex: 1; }
  label {
    display: block;
    font-size: 11px;
    color: #666;
    margin-bottom: 4px;
  }
  input[type="text"] {
    width: 100%;
    padding: 7px 9px;
    box-sizing: border-box;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 13px;
    background: white;
  }
  .method-row {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 12px;
    font-size: 12px;
    color: #444;
  }
  .method-option {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    margin-bottom: 0;
    font-size: 12px;
    color: #444;
  }
  .method-option input { margin: 0; }
  .native-status {
    font-size: 11px;
    color: #888;
  }
  .native-status.ok { color: #1a7f3c; }
  .native-status.error { color: #d33; }

  .server-row {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
    align-items: center;
  }
  .server-row .field { flex: 1; }
  .icon-btn {
    border: none;
    background: #f0f0f0;
    color: #666;
    width: 30px;
    height: 30px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: #e5e5e5; }
  .icon-btn.danger { color: #d33; }

  .add-server-btn {
    margin-top: 4px;
    border: 1px dashed #ccc;
    background: transparent;
    color: #666;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  .add-server-btn:hover { background: #f2f2f2; }

  .remove-domain-btn {
    border: none;
    background: transparent;
    color: #d33;
    font-size: 11px;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
  }

  #addDomainBtn {
    display: block;
    width: 100%;
    padding: 10px;
    border: 1px dashed #bbb;
    background: transparent;
    color: #555;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    margin-bottom: 20px;
  }
  #addDomainBtn:hover { background: #f2f2f2; }

  #save {
    padding: 10px 20px;
    border: none;
    background: #2563eb;
    color: white;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  #save:hover { background: #1d4ed8; }
  #saved {
    display: inline-block;
    margin-left: 10px;
    font-size: 12px;
    color: #1a7f3c;
    opacity: 0;
    transition: opacity .2s;
  }
  #saved.error { color: #d33; }
</style>
</head>
<body>
  <h1>도메인 / 서버 관리</h1>
  <div class="sub">도메인마다 여러 개의 서버(IP)를 등록할 수 있습니다. 팝업에서 도메인별로 라우팅할 서버를 선택하게 됩니다.</div>

  <div id="domains"></div>
  <button id="addDomainBtn">+ 도메인 추가</button>

  <button id="save">저장</button>
  <span id="saved">저장됨 ✓</span>

  <script src="common.js"></script>
  <script src="options.js"></script>
</body>
</html>
